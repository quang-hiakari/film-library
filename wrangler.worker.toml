name = "film-library-thumb-cron"
main = "src/worker-thumbnail-cron.ts"
compatibility_date = "2026-03-30"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = false
invocation_logs = true

[triggers]
crons = ["*/5 * * * *"]

[[r2_buckets]]
binding = "R2"
bucket_name = "film-library"
